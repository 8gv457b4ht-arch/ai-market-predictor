# AI Market Predictor - 24/7 stack. Start: ./scripts/start.sh  (or: docker compose up -d --build)
# Every service restarts automatically after a crash and after a VPS reboot
# (restart: unless-stopped + the Docker daemon enabled at boot, see deploy/install_docker_ubuntu.sh).

x-app: &app
  build:
    context: .
    target: runtime
  image: ai-market-predictor:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/market.sqlite3}
    MODEL_DIR: /app/models
    BACKUP_DIR: /app/backups
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./backups:/app/backups
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "api"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  collector:
    <<: *app
    command: ["python", "-m", "backend.app.workers.runner", "collector"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "service", "collector", "120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  news:
    <<: *app
    command: ["python", "-m", "backend.app.workers.runner", "news"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "service", "news", "900"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 300s

  predictor:
    <<: *app
    command: ["python", "-m", "backend.app.workers.runner", "predictor"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "service", "predictor", "300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  learner:
    <<: *app
    command: ["python", "-m", "backend.app.workers.runner", "learner"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # training a challenger can take several minutes; the heartbeat is written between cycles
      test: ["CMD", "python", "scripts/healthcheck.py", "service", "learner", "3600"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 600s

  backup:
    <<: *app
    command: ["python", "-m", "backend.app.workers.runner", "backup"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "service", "backup", "900"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Optional HTTPS reverse proxy with automatic Let's Encrypt certificates.
  # Enable with:  docker compose --profile https up -d   (needs DOMAIN in .env and ports 80/443 open)
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
